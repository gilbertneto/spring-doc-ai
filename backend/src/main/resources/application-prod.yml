spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springdocai}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:springdocai}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
